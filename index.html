<script>
/* ===== New Lands: compact save of two worlds + per-world tables ===== */
const NL_CN=128;
const packT=t=>[t.t,t.o,t.b,t.l,Math.round((t.e||0)*100)/100,t.r?1:0,t.w||0,t.q||0,t.off||0,t.oi||'',t.z?1:0,t.mx==null?-1:t.mx,t.my==null?-1:t.my,t.pt?1:0,t.pa==null?-1:t.pa];
const unpackT=a=>{const t={t:a[0],o:a[1],b:a[2],l:a[3],e:a[4]};if(a[5])t.r=1;if(a[6])t.w=a[6];if(a[7])t.q=a[7];if(a[8])t.off=a[8];if(a[9])t.oi=a[9];if(a[10])t.z=1;if(a[11]>=0){t.mx=a[11];t.my=a[12]}if(a[13]){t.pt=1;t.pa=a[14]}return t};
function packS(S0){const rl={};for(const k in S0.rl||{}){const r=S0.rl[k];rl[k]=Object.assign({},r,{tiles:r.tiles.map(packT)})}return Object.assign({},S0,{tiles:S0.tiles.map(packT),rl})}
function unpackS(s){if(Array.isArray(s.tiles[0]))s.tiles=s.tiles.map(unpackT);for(const k in s.rl||{}){const r=s.rl[k];if(Array.isArray(r.tiles[0]))r.tiles=r.tiles.map(unpackT)}}
const NL_OWN=[null,null,{n:'Dune Nomads',c:'#ffb14a'},{n:'Stone Clans',c:'#c3cad6'},{n:'Jungle Tribe',c:'#4ade80'},{n:'Ash Raiders',c:'#ff6b6b'}];let NL_HOME=null;
function nlApplyTables(r){if(!NL_HOME)NL_HOME=OWN.map(o=>({n:o.n,c:o.c}));if(window.ONL){Object.assign(MAXL,r=='c'?{1:40,2:25,3:35}:{1:25,2:15,3:20});return}for(let k=2;k<6;k++){const s=r=='c'?NL_OWN[k]:NL_HOME[k];OWN[k].n=s.n;OWN[k].c=s.c}Object.assign(MAXL,r=='c'?{1:40,2:25,3:35}:{1:25,2:15,3:20})}
function spriteBig(key,t,x,y,qs,ph){let s=SPR.get(key);if(s)return s;if(SPR.size>320)SPR.clear();const w=Math.ceil(4.8*qs*PR),h=Math.ceil(4.2*qs*PR),cvv=mkc(w,h),c=cvv.getContext('2d');c.setTransform(PR,0,0,PR,0,0);drawMetro(c,2.4*qs,2.7*qs,2*qs,t.l,OWN[t.o].c,1+ph*.9);s={c:cvv,ox:2.4*qs,oy:2.7*qs,w:w/PR,h:h/PR};SPR.set(key,s);return s}

/* ===== New Lands graphics: desert, palms, Metropolis (2x2), industrial mines, fortresses ===== */
function palmc(g,x,y,s){g.fillStyle='#0003';g.beginPath();g.ellipse(x+s*.22,y+s*.06,s*.3,s*.07,0,0,7);g.fill();
  g.strokeStyle='#7a5230';g.lineWidth=Math.max(1.5,s*.09);g.lineCap='round';g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+s*.1,y-s*.35,x+s*.04,y-s*.62);g.stroke();
  for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*.62,lx=x+s*.04+Math.cos(a)*s*.42,ly=y-s*.62+Math.sin(a)*s*.3+s*.1*Math.abs(i-2.5)*.4;g.fillStyle=i%2?'#2e9a4d':'#47bd62';g.beginPath();g.moveTo(x+s*.04,y-s*.62);g.quadraticCurveTo((x+lx)/2+s*.04,y-s*.78-Math.abs(i-2.5)*.02*s,lx,ly);g.quadraticCurveTo((x+lx)/2+s*.02,y-s*.6,x+s*.04,y-s*.62);g.fill()}
  g.fillStyle='#6b3f1d';g.beginPath();g.arc(x+s*.01,y-s*.6,s*.04,0,7);g.arc(x+s*.08,y-s*.59,s*.04,0,7);g.fill();g.lineCap='butt'}
function cactusc(g,x,y,s){g.fillStyle='#0003';g.beginPath();g.ellipse(x+s*.15,y+s*.04,s*.22,s*.06,0,0,7);g.fill();
  const body=(bx,by,w,h)=>{g.fillStyle='#3f9c52';g.beginPath();g.roundRect(bx-w/2,by-h,w,h,w/2);g.fill();g.fillStyle='#63c274';g.fillRect(bx-w*.18,by-h+w*.4,w*.16,h-w*.6)};
  body(x,y,s*.2,s*.62);g.strokeStyle='#3f9c52';g.lineWidth=s*.12;g.lineCap='round';g.beginPath();g.moveTo(x-s*.1,y-s*.28);g.lineTo(x-s*.26,y-s*.28);g.lineTo(x-s*.26,y-s*.46);g.moveTo(x+s*.1,y-s*.2);g.lineTo(x+s*.25,y-s*.2);g.lineTo(x+s*.25,y-s*.38);g.stroke();g.lineCap='butt';
  g.fillStyle='#ff7ab6';g.beginPath();g.arc(x,y-s*.64,s*.045,0,7);g.fill()}
/* ---- shared helpers for the tall buildings ---- */
function nlWindows(c,x,y,w,h,n,lit,tm){c.fillStyle='#2b2230';for(let i=0;i<n;i++){const wx=x-w/2+w*(i+.5)/n;c.fillRect(wx-w*.035,y,w*.07,h);if(lit){c.fillStyle=`rgba(255,214,120,${.55+.35*Math.sin(tm*3+i*1.7)})`;c.fillRect(wx-w*.025,y+h*.1,w*.05,h*.7);c.fillStyle='#2b2230'}}}
function nlDome(c,x,y,r,col,hi,sp){const g=c.createRadialGradient(x-r*.35,y-r*.55,r*.1,x,y-r*.2,r*1.15);g.addColorStop(0,hi);g.addColorStop(.55,col);g.addColorStop(1,'#00000066');c.fillStyle=g;c.beginPath();c.arc(x,y,r,Math.PI,0);c.lineTo(x+r,y);c.lineTo(x-r,y);c.fill();c.strokeStyle='#ffffff55';c.lineWidth=Math.max(.6,r*.07);c.beginPath();c.arc(x,y,r*.82,Math.PI*1.1,Math.PI*1.45);c.stroke();
  if(sp){c.strokeStyle='#ffe9a0';c.lineWidth=Math.max(1,r*.09);c.beginPath();c.moveTo(x,y-r);c.lineTo(x,y-r-sp);c.stroke();c.fillStyle='#ffd23f';c.beginPath();c.arc(x,y-r-sp,r*.12,0,7);c.fill()}}
function nlTower(c,x,by,w,h,wall,col,hi,tm,lit){const g=c.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,wall[0]);g.addColorStop(.5,wall[1]);g.addColorStop(1,wall[2]);c.fillStyle=g;c.fillRect(x-w/2,by-h,w,h);
  c.fillStyle='#0003';for(let k=1;k<h/(w*.5);k++)c.fillRect(x-w/2,by-k*w*.5,w,Math.max(.5,w*.03));c.fillStyle=col;c.fillRect(x-w/2-w*.06,by-h,w*1.12,w*.14);c.fillRect(x-w/2-w*.06,by-h*.45,w*1.12,w*.1);
  for(let i=0;i<3;i++)c.fillRect(x-w/2-w*.06+i*w*.45,by-h-w*.16,w*.22,w*.18);
  c.fillStyle='#2b2230';c.beginPath();c.arc(x,by-h*.72,w*.13,Math.PI,0);c.lineTo(x+w*.13,by-h*.6);c.lineTo(x-w*.13,by-h*.6);c.fill();if(lit){c.fillStyle=`rgba(255,200,100,${.5+.3*Math.sin(tm*4+x)})`;c.fillRect(x-w*.08,by-h*.7,w*.16,w*.14)}}
/* ---- Metropolis: a 2x2 city, W = width of the whole block ---- */
function drawMetro(c,mx,my,W,l,oc,tm){const T=tierOf(1,l),p=pal(T,tm),u=W/20,k=l-26,by=my+W*.3,wall=['#e8dcc0','#fff6e0','#b9aa88'],gold='#ffd23f';
  const gl=(x,y,r,col,a)=>{if(!LOW)glow(c,x,y,r,col,a)};
  gl(mx,my-W*.05,W*.78,p.c,.3+.05*(T-5));
  c.fillStyle='#0008';c.beginPath();c.ellipse(mx,by+u*.9,W*.5,W*.15,0,0,7);c.fill();
  /* rounded marble plaza */
  const pg=c.createLinearGradient(0,by-W*.2,0,by+W*.1);pg.addColorStop(0,'#f6ecd2');pg.addColorStop(1,'#a99a79');c.fillStyle=pg;c.beginPath();c.ellipse(mx,by-u*.2,W*.5,W*.17,0,0,7);c.fill();c.lineWidth=u*.4;c.strokeStyle=p.c;c.stroke();
  c.strokeStyle='#0002';c.lineWidth=1;for(let i=-3;i<=3;i++){c.beginPath();c.ellipse(mx,by-u*.2,W*.5*Math.abs(i)/3.4,W*.17*Math.abs(i)/3.4,0,0,7);c.stroke()}
  /* skyline of houses */
  const nh=5+Math.min(6,k>>1);for(let i=0;i<nh;i++){const q=i/(nh-1),hx=mx-W*.36+q*W*.72,hh=u*(1.7+((i*37+k)%5)*.45),hw=u*(1.5+(i%2)*.4),hy=by-W*.1-Math.sin(q*Math.PI)*u*.8;c.fillStyle=i%2?'#efe3c8':'#e2d2ae';c.fillRect(hx-hw/2,hy-hh,hw,hh);c.fillStyle=i%3==0?p.c:'#c0482f';c.beginPath();c.moveTo(hx-hw*.62,hy-hh);c.lineTo(hx,hy-hh-hw*.7);c.lineTo(hx+hw*.62,hy-hh);c.fill();c.fillStyle='#2b2230';c.fillRect(hx-hw*.12,hy-hh*.45,hw*.24,hh*.3)}
  /* back towers */
  const bt=u*(5.6+k*.12);[-1,1].forEach(s=>nlTower(c,mx+s*W*.3,by-W*.1,u*2.1,bt,wall,p.c,p.d,tm,0));
  [-1,1].forEach(s=>{const x=mx+s*W*.3;nlDome(c,x,by-W*.1-bt-u*.2,u*1.35,T==5?gold:p.c,'#fff',u*1.4);flag(c,x+s*u*1.2,by-W*.1-bt-u*2.6,u*2,oc,tm)});
  /* palace */
  const ph=u*(4.3+k*.14),pw=W*.34;
  c.fillStyle=wall[1];c.fillRect(mx-pw/2,by-W*.1-ph,pw,ph);c.fillStyle=wall[2];c.fillRect(mx+pw*.22,by-W*.1-ph,pw*.28,ph);
  c.fillStyle=p.c;c.fillRect(mx-pw/2-u*.2,by-W*.1-ph,pw+u*.4,u*.55);c.fillRect(mx-pw/2-u*.2,by-W*.1-ph*.5,pw+u*.4,u*.35);
  for(let i=0;i<6;i++){const cxn=mx-pw*.42+i*pw*.168;c.fillStyle='#fffaf0';c.fillRect(cxn-u*.22,by-W*.1-ph*.46,u*.44,ph*.42);c.fillStyle='#0002';c.fillRect(cxn+u*.05,by-W*.1-ph*.46,u*.17,ph*.42)}
  nlWindows(c,mx,by-W*.1-ph*.9,pw*.8,ph*.28,5,1,tm);
  const uw=pw*.62,uh=u*(2.8+k*.1),uy=by-W*.1-ph;c.fillStyle=wall[1];c.fillRect(mx-uw/2,uy-uh,uw,uh);c.fillStyle=p.c;c.fillRect(mx-uw/2-u*.15,uy-uh,uw+u*.3,u*.45);nlWindows(c,mx,uy-uh*.8,uw*.8,uh*.5,3,1,tm);
  const dr=u*(2.6+Math.min(1.2,k*.08)),dy=uy-uh;
  [-1,1].forEach(s=>{if(k>=4){nlTower(c,mx+s*uw*.78,dy+uh*.55,u*1.4,u*3.4,wall,p.c,p.d,tm,0);nlDome(c,mx+s*uw*.78,dy+uh*.55-u*3.4,u*.95,gold,'#fff',u*.8)}});
  nlDome(c,mx,dy,dr,T==5?gold:p.c,'#ffffff',u*(2.6+(k>=9?1.2:0)));
  if(k>=9){c.strokeStyle='#ffe9a0';c.lineWidth=u*.14;c.beginPath();c.arc(mx,dy-dr-u*3.2,u*.9,0,7);c.stroke()}
  /* front wall + gate */
  const fy=by+u*.2,fh=u*3.1;c.fillStyle='#d9ccaa';c.fillRect(mx-W*.34,fy-fh,W*.68,fh);c.fillStyle='#0002';for(let r=1;r<4;r++)c.fillRect(mx-W*.34,fy-r*fh/4,W*.68,Math.max(.5,u*.06));
  c.fillStyle=p.c;c.fillRect(mx-W*.36,fy-fh-u*.2,W*.72,u*.5);for(let i=0;i<13;i++)c.fillRect(mx-W*.36+i*W*.06,fy-fh-u*.7,W*.035,u*.55);
  c.fillStyle='#1a1426';c.beginPath();c.arc(mx,fy,u*1.5,Math.PI,0);c.lineTo(mx+u*1.5,fy);c.lineTo(mx-u*1.5,fy);c.fill();c.strokeStyle='#8a7a5c';c.lineWidth=u*.14;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(mx+i*u*.5,fy);c.lineTo(mx+i*u*.5,fy-u*1.5)}c.stroke();
  [-1,1].forEach(s=>{c.fillStyle=oc;c.beginPath();c.moveTo(mx+s*u*3.2-u*.7,fy-fh*.9);c.lineTo(mx+s*u*3.2+u*.7,fy-fh*.9);c.lineTo(mx+s*u*3.2+u*.7,fy-fh*.1);c.lineTo(mx+s*u*3.2,fy-fh*.28);c.lineTo(mx+s*u*3.2-u*.7,fy-fh*.1);c.fill();c.strokeStyle=gold;c.lineWidth=u*.12;c.stroke()});
  /* front corner towers */
  const ft=u*(5+k*.1);[-1,1].forEach(s=>{const x=mx+s*W*.41;nlTower(c,x,by+u*.5,u*2.5,ft,wall,p.c,p.d,tm,1);nlDome(c,x,by+u*.5-ft,u*1.6,T==5?gold:p.c,'#fff',u*1.6);flag(c,x,by+u*.5-ft-u*3,u*2.4,oc,tm)});
  /* fountain */
  const fx=mx,fyy=by+u*1.9;c.fillStyle='#9fd9ff';c.beginPath();c.ellipse(fx,fyy,u*2,u*.7,0,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=u*.2;c.stroke();
  c.strokeStyle='#ffffffcc';c.lineWidth=u*.2;for(let i=0;i<3;i++){const ph2=(tm*1.6+i*.33)%1;c.beginPath();c.moveTo(fx,fyy);c.quadraticCurveTo(fx+(i-1)*u*.8,fyy-u*(1.6+ph2),fx+(i-1)*u*1.4,fyy+(ph2-.5)*u*.4);c.stroke()}
  /* tier flair */
  if(T>=5){for(let i=0;i<14;i++){const a=i*2.4+tm*.8,rr=W*(.1+.36*((i*53)%10)/10),sx=mx+Math.cos(a)*rr,sy=my-W*.22+Math.sin(a*1.3)*W*.16;c.globalAlpha=.4+.4*Math.sin(tm*5+i);c.fillStyle='#fff8d0';c.beginPath();c.arc(sx,sy,u*.16,0,7);c.fill()}c.globalAlpha=1}
  if(T>=6){orbs(c,mx,dy-dr-u*3,u*5.8,T==6?4:7,i=>T==6?'#7df9ff':rb(tm,i*50),tm);gl(mx,dy-dr-u*3,u*5,'#7df9ff',.5);c.strokeStyle='#bffcff88';c.lineWidth=u*.5;c.beginPath();c.moveTo(mx,dy-dr-u*3);c.lineTo(mx,my-W*.7);c.stroke()}
  if(T>=7){c.save();c.translate(mx,dy-dr-u*3.5);c.rotate(tm*.7);c.strokeStyle=rb(tm,0);c.lineWidth=u*.35;c.beginPath();c.ellipse(0,0,u*6.4,u*2.2,0,0,7);c.stroke();c.rotate(1.2);c.strokeStyle=rb(tm,120);c.beginPath();c.ellipse(0,0,u*6.4,u*2.2,0,0,7);c.stroke();c.restore();gem(c,mx,dy-dr-u*3.8,u*.9,rb(tm,200),.9)}
  badge(c,mx+W*.43,my+W*.3,W*.065,oc,l)}
/* ---- Industrial mine (levels 16-25) ---- */
function drawMineX(c,mx,my,ts,l,res,tm){const T=tierOf(2,l),p=pal(T,tm),u=ts*.1,by=my+ts*.3,rc=RC[res],k=l-16,tc=p.c;
  if(!LOW)glow(c,mx,my,ts*(.75+k*.02),rc,.28);
  c.fillStyle='#0008';c.beginPath();c.ellipse(mx,by+u*.3,u*5,u*1.2,0,0,7);c.fill();
  /* rock hill with strata */
  const hg=c.createLinearGradient(0,by-u*6,0,by);hg.addColorStop(0,'#7a7f8a');hg.addColorStop(1,'#4b505b');c.fillStyle=hg;c.beginPath();c.moveTo(mx-u*5,by);c.quadraticCurveTo(mx-u*2,by-u*6.2,mx+u*1,by-u*4.6);c.quadraticCurveTo(mx+u*3.4,by-u*5.5,mx+u*5,by);c.fill();c.strokeStyle='#0003';c.lineWidth=1;for(let i=1;i<4;i++){c.beginPath();c.moveTo(mx-u*4+i*u*.5,by-i*u*1.1);c.quadraticCurveTo(mx,by-i*u*1.35-u*.5,mx+u*4-i*u*.5,by-i*u*1.1);c.stroke()}
  /* shaft mouth */
  c.fillStyle='#0f0a07';c.beginPath();c.arc(mx-u*1.8,by,u*1.4,Math.PI,0);c.fill();c.strokeStyle=tc;c.lineWidth=u*.35;c.beginPath();c.arc(mx-u*1.8,by,u*1.4,Math.PI,0);c.stroke();
  /* processing shed with sawtooth roof */
  const sx=mx+u*2.2,sw=u*3.6,sh=u*2.6;c.fillStyle='#8c95a3';c.fillRect(sx-sw/2,by-sh,sw,sh);c.fillStyle='#6d7684';c.fillRect(sx-sw/2,by-sh,sw,u*.45);
  for(let i=0;i<3;i++){const rx=sx-sw/2+i*sw/3;c.fillStyle=i%2?'#59616f':'#6b7482';c.beginPath();c.moveTo(rx,by-sh);c.lineTo(rx,by-sh-u*1.2);c.lineTo(rx+sw/3,by-sh);c.fill()}
  for(let i=0;i<3;i++){c.fillStyle=`rgba(255,${150+i*20},60,${.6+.3*Math.sin(tm*5+i*2)})`;c.fillRect(sx-sw/2+u*.3+i*u*1.15,by-sh*.7,u*.8,u*.9)}
  c.fillStyle=tc;c.fillRect(sx-sw/2,by-sh*.2,sw,u*.3);
  /* smoke stacks */
  const ns=1+(l>=18)+(l>=22);for(let i=0;i<ns;i++){const x=sx+sw/2-u*.4-i*u*.9,top=by-sh-u*(2.4+i*.5);c.fillStyle=i%2?'#5a5f6a':'#6f7480';c.fillRect(x-u*.3,top,u*.6,sh+u*2.4-u*(0));c.fillStyle=tc;c.fillRect(x-u*.38,top,u*.76,u*.3);
    for(let q=0;q<3;q++){const f=(tm*.45+q*.34+i*.2)%1;c.globalAlpha=(1-f)*.45;c.fillStyle='#d8dde4';c.beginPath();c.arc(x+f*u*1.3,top-f*u*3.2,u*(.4+f*.8),0,7);c.fill()}c.globalAlpha=1}
  /* headframe tower with spinning wheel */
  const hx=mx-u*3.3,hh=u*(4.8+Math.min(2,k*.2));c.strokeStyle='#cfd5de';c.lineWidth=u*.32;c.beginPath();c.moveTo(hx-u*.9,by);c.lineTo(hx,by-hh);c.lineTo(hx+u*.9,by);c.moveTo(hx-u*.55,by-hh*.45);c.lineTo(hx+u*.55,by-hh*.45);c.moveTo(hx-u*.7,by-hh*.2);c.lineTo(hx+u*.35,by-hh*.45);c.moveTo(hx+u*.7,by-hh*.2);c.lineTo(hx-u*.35,by-hh*.45);c.stroke();
  c.save();c.translate(hx,by-hh);c.rotate(tm*(1.4+k*.12));c.strokeStyle=tc;c.lineWidth=u*.28;c.beginPath();c.arc(0,0,u*.95,0,7);for(let i=0;i<6;i++){c.moveTo(0,0);c.lineTo(Math.cos(i*1.0472)*u*.95,Math.sin(i*1.0472)*u*.95)}c.stroke();c.restore();
  c.strokeStyle='#222';c.lineWidth=1.2;c.beginPath();c.moveTo(hx,by-hh+u*.9);c.lineTo(mx-u*1.8,by-u*1.3);c.stroke();
  /* conveyor with moving ore */

{n:'Medium',d:'Pricier builds, slower income, pushier rivals.',cost:1.4,inc:.85,rinc:.85,ai:1.6,aip:1.1,ex:1.3,sp:1.2,st:.8},
{n:'Hard',d:'Scarce coin and resources, costly upgrades, aggressive rivals.',cost:1.9,inc:.7,rinc:.65,ai:2.3,aip:1.25,ex:1.6,sp:1.5,st:.6},
{n:'Insane',d:'Brutal prices, tiny income, rivals strike constantly.',cost:2.6,inc:.55,rinc:.5,ai:3.2,aip:1.45,ex:2,sp:1.9,st:.45}];

/* ===== level rules ===== */
const lv=t=>t.l||1;
const tierOf=(k,l)=>k==1?(l>25?Math.min(7,5+((l-26)/5|0)):Math.min(4,(l-1)/5|0)):k==2?(l>15?Math.min(5,4+((l-16)/5|0)):(l>=15?3:Math.min(2,(l-1)/5|0))):(l>20?Math.min(7,5+((l-21)/8|0)):Math.min(4,(l-1)/5|0));
const fx={inc:l=>.4*Math.pow(l,1.18),mine:l=>1+.25*(l-1),fdef:l=>14+6*l,fatk:l=>6+2*l,fnear:l=>.7+.15*l,cdef:l=>5+6*l,catk:l=>4*l};
const ore=(l,a,b,c)=>({silver:l>=5?a*(l-4):0,gold:l>=10?b*(l-9):0,diamond:l>=15?c*(l-14):0});
const UPC={
 1:(t,l)=>({coins:Math.round(120*Math.pow(1.32,l-1)),wood:12*l,stone:10*l,...ore(l,3,2,1)}),
 3:(t,l)=>({coins:Math.round(100*Math.pow(1.28,l-1)),wood:15+6*l,stone:50+22*l,...ore(l,3,2,1)}),
 2:(t,l)=>{const m=MM[t.t];return{coins:Math.round(40*m*Math.pow(1.38,l-1)),wood:8*l,stone:6*m*l,silver:'fm'.includes(t.t)?0:3*l,gold:l>=9&&m>1?2*(l-8):0}}};
const claimCost=()=>Math.max(1,Math.round((12+owned(1)*1.2)*(1-rt('claim'))));
const cityCost=()=>{const n=cities(1).length;return{coins:Math.round(120*Math.pow(1.7,n)/(1+1.8*Math.pow(Math.max(0,Math.min(1,(n-5)/10)),2))),wood:20+10*n,stone:10+8*n}};
const mineCost=t=>({coins:30*MM[t],wood:12,stone:6*MM[t]});
const SC=c=>{const m=DF().cost*fxm('cost')*wsm(),o={};for(const k in c)o[k]=c[k]?Math.max(1,Math.round(c[k]*m)):0;return o};
const canPay=c=>{c=SC(c);return (c.coins||0)<=S.coins&&RES.every(r=>(c[r]||0)<=S.res[r])};
const pay=c=>{c=SC(c);S.coins-=c.coins||0;RES.forEach(r=>S.res[r]-=c[r]||0)};
const AMOUNT_UNITS=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function compactAmount(value){const n=Number(value);if(!Number.isFinite(n))return n>0?'∞':n<0?'−∞':'0';const abs=Math.abs(n);if(abs<1000)return Number.isInteger(n)?String(n):String(Number(n.toFixed(3)));let tier=Math.floor(Math.log10(abs)/3);if(tier>AMOUNT_UNITS.length)return n.toExponential(3);let scaled=n/Math.pow(1000,tier);if(Math.abs(Number(scaled.toFixed(3)))>=1000){tier++;scaled=n/Math.pow(1000,tier)}const suffix=AMOUNT_UNITS[tier-1];return suffix?`${scaled.toFixed(3)}${suffix}`:n.toExponential(3)}
const costStr=c=>{c=SC(c);return ['coins',...RES].filter(k=>c[k]).map(k=>`<span class="${(k=='coins'?S.coins:S.res[k])>=c[k]?'':'bad'}">${ICON[k]}${compactAmount(c[k])}</span>`).join(' ')};
const cities=o=>S.tiles.filter(t=>t.o==o&&t.b==1),owned=o=>S.tiles.reduce((n,t)=>n+(t.o==o),0);
const ports=()=>S.tiles.reduce((n,t)=>n+(t.o==1&&t.b==4),0);
const cap=()=>Math.round((100+60*cities(1).reduce((n,t)=>n+t.l,0)+150*portLv())*(1+rt('store')));
const adj=(x,y,o)=>D4.some(([a,b])=>ok(x+a,y+b)&&T(x+a,y+b).o==o);
const seaAdj=(x,y)=>D4.some(([a,b])=>ok(x+a,y+b)&&T(x+a,y+b).t=='w'&&!T(x+a,y+b).r);
function near(x,y,o){let n=0;for(let b=-2;b<=2;b++)for(let a=-2;a<=2;a++)if((a||b)&&ok(x+a,y+b)){const t=T(x+a,y+b);if(t.o==o&&t.b==3)n+=fx.fnear(lv(t))}return n}
function def(x,y){const t=T(x,y);return Math.round(8+(t.b==3?fx.fdef(lv(t)):0)+(t.b==1?fx.cdef(t.l):0)+12*near(x,y,t.o))}
const power=()=>Math.round(18+S.tiles.reduce((n,t)=>n+(t.o==1&&t.b==3?fx.fatk(lv(t)):0)+(t.o==1&&t.b==1?fx.catk(t.l):0),0));
const chance=(x,y)=>Math.max(0,Math.min(1,(1.3-def(x,y)/power())/.6));
const sp=()=>Math.min(.06,portLv()*.015+rt('spr')),bid=r=>S.price[r]*(1-.06*DF().sp+sp()),ask=r=>S.price[r]*(1+.08*DF().sp-sp());

/* ===== world generation ===== */
const hv=(x,y)=>(((x*374761393+y*668265263)^(x*y*1274126177))>>>0)%1000/1000,hs=(x,y)=>(((x*73856093)^(y*19349663))>>>0)%100;
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx_=x-xi,fy=y-yi,u=fx_*fx_*(3-2*fx_),v=fy*fy*(3-2*fy),a=hv(xi,yi),b=hv(xi+1,yi),c=hv(xi,yi+1),d=hv(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function bfs(src,pass){const d=new Array(N*N).fill(99),q=[];src.forEach(i=>{d[i]=0;q.push(i)});for(let h=0;h<q.length;h++){const i=q[h],x=i%N,y=(i/N)|0;D4.forEach(([a,b])=>{if(ok(x+a,y+b)){const j=(y+b)*N+x+a;if(pass(j)&&d[j]>d[i]+1){d[j]=d[i]+1;q.push(j)}}})}return d}
function calcWD(){WD=bfs(S.tiles.map((t,i)=>t.t!='w'?i:-1).filter(i=>i>=0),()=>true)}
function newGame(d){
  const g=[];for(let i=0;i<N*N;i++)g.push({t:'g',o:0,b:0,l:0,e:0});
  const ox=rnd(0,99),oy=rnd(0,99),f=(x,y,s,o)=>vn(x/s+ox+o,y/s+oy+o)*.65+vn(x*2/s+ox+o,y*2/s+oy+o)*.35,rg=(x,y,s,o)=>1-Math.abs(vn(x/s+ox+o,y/s+oy+o)*2-1);
  g.forEach((t,i)=>{const x=i%N,y=(i/N)|0,v=1-Math.pow(Math.hypot(x-28,y-28)/25,1.8)+(f(x,y,7,0)-.5)*.6;
    if(v<.2||(v>.42&&f(x,y,6,120)>.68)){t.t='w';return}
    t.e=v;const r=rg(x,y,8,50)*.75+rg(x,y,4,70)*.25;
    if(v>.38&&r>.88){t.e=r;const q=Math.random();t.t=r>.95?(q<.15?'D':q<.5?'G':'S'):r>.92?(q<.15?'G':q<.5?'S':'m'):(q<.12?'S':'m')}
    else if(v>.3&&f(x,y,10,200)*.8+f(x,y,3,300)*.2>.56)t.t='f'});
  const ST0=[0,[28,43],[12,15],[44,15],[45,33],[12,34]],st=ST0.map((_,k)=>k&&window.ONL?ST0[k==window.ONL.slot?1:k==1?window.ONL.slot:k]:ST0[k]);
  for(let k=1;k<6;k++){const [sx,sy]=st[k];for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(x*x+y*y<=9){const t=g[(sy+y)*N+sx+x];t.o=k;if(t.t=='w'){t.t='g';t.e=.5}}for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)if(x*x+y*y<=4){const t=g[(sy+y)*N+sx+x];t.t='g';t.e=.5}const c=g[sy*N+sx];c.t='g';c.b=1;c.l=(k==1||window.ONL)?1:3}
  [[31,43,'f'],[25,43,'m'],[28,46,'f'],[26,41,'S']].forEach(([x,y,t])=>{const c=g[y*N+x];c.t=t;c.e=t=='f'?.6:.92});
  const dd=DIFFS[d];
  S={v:2,n:N,tiles:g,coins:Math.round(250*dd.st),res:{},price:{...BASE},hist:{},mom:{},cam:{x:0,y:0},sel:null,time:0,inc:0,news:'',diff:d,ts:Date.now(),mb:1};
  RES.forEach(r=>{S.res[r]=Math.round((r=='wood'?40:r=='stone'?25:0)*dd.st);S.hist[r]=[BASE[r]]});
  ensureM();sideFill();calcWD();rivers();center(28,43);
}
function rivers(){
  const ld=bfs(S.tiles.map((t,i)=>t.t=='w'?i:-1).filter(i=>i>=0),()=>true),src=[];
  S.tiles.forEach((t,i)=>{if(MR[t.t]&&t.t!='f'&&ld[i]>=5&&!t.o)src.push(i)});
  for(let k=0,n=0;k<40&&n<6&&src.length;k++){let i=src[rnd(0,src.length)|0];if(S.tiles[i].r)continue;n++;
    while(ld[i]>0){const x=i%N,y=(i/N)|0,c=D4.filter(([a,b])=>ok(x+a,y+b)).map(([a,b])=>(y+b)*N+x+a).filter(j=>ld[j]<ld[i]&&!S.tiles[j].o);if(!c.length)break;
      const t=S.tiles[i];t.t='w';t.r=1;t.b=0;i=c[rnd(0,c.length)|0]}}
  calcWD()}
const center=(x,y)=>{const ts=T0*zoom;S.cam.x=x*ts-W/2;S.cam.y=y*ts-H/2};
function home(){const i=S.tiles.findIndex(t=>t.o==1&&t.b==1);i<0?center(28,43):center(i%N,(i/N)|0)}
function zoomBy(f){const ts=T0*zoom,a=(S.cam.x+W/2)/ts,b=(S.cam.y+H/2)/ts;zoom=Math.max(.5,Math.min(2.2,zoom*f));const t2=T0*zoom;S.cam.x=a*t2-W/2;S.cam.y=b*t2-H/2}
function save(){if(!S)return;S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v==2&&s.n==N){S=s;ensureM();calcWD();return true}}catch(e){}return false}

/* ===== actions ===== */
function toast(m){const e=$('toast');e.innerHTML=m;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2200)}
function act(a){
  const s=S.sel;if(!s)return;const [x,y]=s,t=T(x,y);let c;
  if(a=='claim'){c={coins:claimCost()};if(!canPay(c)||!adj(x,y,1)||t.o)return;pay(c);t.o=1;S.st.gained++;toast('Land claimed')}
  else if(a=='city'){c=cityCost();if(!canPay(c)||owned(1)<12*(cities(1).length+1))return;pay(c);t.b=1;t.l=1;S.st.built++;toast('City founded')}
  else if(a=='mine'){c=mineCost(t.t);if(!canPay(c))return;pay(c);t.b=2;t.l=1;S.st.built++;toast('Mine opened')}
  else if(a=='fort'){if(!canPay(FC))return;pay(FC);t.b=3;t.l=1;S.st.built++;toast('Stronghold raised')}
  else if(a=='port'){if(!canPay(PC)||t.b||!cities(1).some(q=>q.l>=3))return;pay(PC);t.b=4;S.st.built++;toast('Port built — trade flows!')}
  else if(a=='up'){const l=lv(t);c=UPC[t.b](t,l);if(l>=MAXL[t.b]||!canPay(c))return;pay(c);t.l=l+1;S.st.upgrades++;toast('Upgraded to level '+t.l)}
  else if(a=='atk'){c={coins:40};if(!canPay(c)||!adj(x,y,1))return;pay(c);
    if(power()*rnd(.7,1.3)>def(x,y)){const loot=Math.round((25+(t.b==1?60*t.l:0))*(1+rt('loot')));S.coins+=loot;t.o=1;S.st.gained++;S.st.won++;toast('Victory! Looted 🪙'+compactAmount(loot));kingdomCheck()}else{S.st.lostB++;toast('Attack repelled')}}
  buzz();save();last='';render();hud()}
function sel(v){S.sel=v;render()}

/* ===== economy ===== */
function marketTick(){
  RES.forEach(r=>{const m=(S.mom[r]||0)*.92+rnd(-1,1)*.5*VOL[r];S.mom[r]=m;let p=S.price[r];p+=(BASE[r]-p)*.015+p*m*.012;S.price[r]=Math.max(BASE[r]*.35,Math.min(BASE[r]*2.8,p))});
  if(Math.random()<.02){const r=RES[rnd(0,5)|0],up=Math.random()<.5;S.price[r]*=up?1.6:.58;S.mom[r]=0;S.news=up?`${ICON[r]} Demand for ${r} surges. Good time to sell!`:`${ICON[r]} ${r[0].toUpperCase()+r.slice(1)} floods the market. Time to buy?`;toast(S.news)}
  if((S.time|0)%2==0)RES.forEach(r=>{const h=S.hist[r];h.push(S.price[r]);if(h.length>40)h.shift()})}
function fin(){buzz();save();lastM='';renderMarket();hud()}
function sell(r,f){const n=Math.floor(S.res[r]*f);if(!n)return;S.coins+=Math.floor(n*bid(r));S.res[r]-=n;S.st.trades++;S.price[r]*=1-Math.min(.35,n*IMP[r]);fin()}
function buy(r){const n=Math.min(10,cap()-Math.floor(S.res[r]));if(n<=0)return toast('Storage is full');const c=Math.ceil(n*ask(r));if(c>S.coins)return toast('Not enough coins');S.coins-=c;S.res[r]+=n;S.st.trades++;S.price[r]*=1+Math.min(.3,n*IMP[r]*.8);fin()}
function aiTick(){
  const d=DF();
  for(let k=2;k<6;k++){const mine=[];S.tiles.forEach((t,i)=>{if(t.o==k)mine.push(i)});if(!mine.length)continue;
    if(Math.random()<.55*d.ex*(window.clAIStyle&&!S.on?(({conqueror:1.2,merchant:.8,warden:.7,opportunist:1.1,scholar:.85})[window.clAIStyle(k)]||1):1)&&mine.length<130){const i=mine[rnd(0,mine.length)|0],x=i%N,y=(i/N)|0,o=D4.map(([a,b])=>[x+a,y+b]).filter(([a,b])=>ok(a,b)&&!T(a,b).o&&(T(a,b).t!='w'||T(a,b).r));if(o.length){const [a,b]=o[rnd(0,o.length)|0];T(a,b).o=k}}
    if(Math.random()<(.1+Math.min(.15,S.time/1500))*d.ai){const c=[];mine.forEach(i=>{const x=i%N,y=(i/N)|0;D4.forEach(([a,b])=>{if(ok(x+a,y+b)&&T(x+a,y+b).o==1)c.push([x+a,y+b])})});
      if(c.length){const [x,y]=c[rnd(0,c.length)|0];if((18+mine.length*.5)*d.aip*rnd(.7,1.3)>def(x,y)){T(x,y).o=k;S.st.lost++;S.st.hold=0;toast(OWN[k].n+' seized a tile!')}else S.st.repelled++;}}}}
let n10=0;
function tick(){if(window.ADM_PAUSE&&S&&!S.on)return;
  const dt=.1,c=cap(),d=DF();S.time+=dt;S.st.hold+=dt;let inc=0;
  for(const t of S.tiles){if(t.o!=1)continue;if(t.b==1)inc+=fx.inc(t.l)*(t.off>S.time?.4:1);else if(t.b==4){if(!(t.off>S.time))inc+=(1.5+.45*(lv(t)-1))*(1+rt('pinc'))}else if(t.b==2&&!(t.off>S.time)){const r=MR[t.t];S.res[r]=Math.min(c,S.res[r]+RATE[r]*fx.mine(lv(t))*d.rinc*fxm('prod')*(1+rt('prod')+(r=='wood'||r=='stone'?rt('bulk'):rt('ore')))*dt)}}
  inc=(inc+bonusInc())*d.inc*fxm('inc')*(1+rt('inc'))*bmul();const nu=UPK;S.inc=inc-nu;S.coins=Math.max(0,S.coins+(inc-nu)*dt);n10++;
  if(n10%10==0){marketTick();secTick()}if(n10%30==0)aiTick();if(n10%50==0)save();
  if(n10%5==0){hud();if(n10%20==0)render();misTick();if(mOpen)renderMarket();if(misOpen)renderMis()}updateHudAmounts()}

const pal=(T,tm)=>T!=4?{c:TIERS[T][1],d:TIERS[T][2]}:{c:rb(tm,0),d:`hsl(${(tm*80+200)%360},70%,28%)`};

    let pool=EVT.filter(e=>(e.f?hasT(e.f):e.ok())&&!recent.includes(e.id)&&!S.clEventHistory.some(x=>x.id===e.id&&x.time>cutoff)&&!S.evl.includes(e.id)&&!(e.o[0].fx&&S.efx.some(f=>f.n===e.o[0].fx.n)));
    if(!pool.length)pool=EVT.filter(e=>(e.f?hasT(e.f):e.ok())&&!S.clEventHistory.some(x=>x.id===e.id&&x.time>cutoff)&&!(e.o[0].fx&&S.efx.some(f=>f.n===e.o[0].fx.n)));
    S.evAt=S.time+5*(105+rng()*95);if(!pool.length)return;
    const scale=eventScale();let total=pool.reduce((a,e)=>a+e.w,0),r=rng()*total,e=pool[0];for(const q of pool){r-=q.w;if(r<=0){e=q;break}}
    S.clEventHistory.push({id:e.id,time:S.time,scale});if(S.clEventHistory.length>16)S.clEventHistory.shift();
    S.evl=(S.evl||[]).concat(e.id).slice(-6);sfx(e.o.length===1?'mission':'warn');
    const prompt=eventForPrompt(e,scale);
    if(prompt.o.length===1&&!prompt.f){if(applyOpt(prompt,prompt.o[0])){S.st.events++;chron(prompt.ic,`${prompt.n}: ${prompt.o[0].d}`);toast(`${prompt.ic} ${prompt.n} — ${prompt.o[0].d}`)}else chron(prompt.ic,`${prompt.n}: no valid option`)}
    else{S.evp={id:e.id,scale,until:S.time+150,tgt:e.f?pickT(e.f):null};if(S.evp.tgt!=null){const i=S.evp.tgt;HL={x:i%N,y:(i/N)|0,t:performance.now()+9000}}toast(`${prompt.ic} ${prompt.cat}: ${prompt.n} — open the Chronicle to decide`);hint('ev','Events need a decision. Open Menu → Chronicle. Events now scale with kingdom size, and recent events are less likely to repeat.')}
    save();
  };
  choose=function(j){const p=S.evp;if(!p)return;const e=getPromptEvent(),o=e&&e.o[j];if(!o)return;if(o.need&&!o.need())return toast(o.needT||'Requirement not met');if(!applyOpt(e,o))return toast('Missing: '+missStr(SC(o.cost||{})));
    chron(e.ic,`${e.n}: ${o.t}`);S.evp=null;S.st.events++;sfx(o.fx&&(o.fx.prod>1||o.fx.inc>1)?'win':'mission');buzz();save();hud();shK='';render();renderSheet();
  };

  /* AI personalities alter expansion, recruitment and target selection without replacing combat math. */
  function aiStyleFor(k){
    initCLState();if(!S.aiStyle)S.aiStyle={};if(!S.aiStyle[k])S.aiStyle[k]=({2:'conqueror',3:'merchant',4:'warden',5:'opportunist'})[k]||'scholar';return S.aiStyle[k];
  }

  const _clAiAttack=aiAttack;
  aiAttack=function(k,mine,d){
    const style=aiStyleFor(k),pact=S.clDiplomacy&&S.clDiplomacy[k];
    if(pact&&pact.until>S.time&&(pact.type==='nonaggression'||pact.type==='tribute'))return;
    /* Original AI chooses a target randomly; bias its target selection toward its doctrine. */
    const a=S.ai[k],tg=[];mine.forEach(i=>{const x=i%N,y=(i/N)|0;D4.forEach(([dx,dy])=>{if(ok(x+dx,y+dy)&&T(x+dx,y+dy).o===1)tg.push((y+dy)*N+x+dx)})});
    if(S.on)return _clAiAttack(k,mine,d);
    if(!tg.length||sum(a)<2)return;
    const unique=[...new Set(tg)];let best=unique[0],bestScore=-Infinity;
    for(const i of unique){const t=S.tiles[i],x=i%N,y=(i/N)|0,defence=def(x,y),valuable=(t.b===1?4:t.b===2?3:t.b===5?2:t.b===7?2:t.b===3?1:0),nearby=cnt(x,y,2,q=>q.o===1&&q.b>0),score=(style==='conqueror'?-defence*.12+valuable*.5:style==='merchant'?valuable*1.5+(t.b===5?3:0)-defence*.08:style==='warden'?-defence*.1+(t.b===1?1:0):style==='opportunist'?valuable*1.1-defence*.2+nearby*.15:style==='scholar'?valuable*.7-defence*.1:0)+Math.random()*.9;
      if(score>bestScore){bestScore=score;best=i}}
    const x=best%N,y=(best/N)|0,comp={};for(const u in UN)comp[u]=Math.floor((a[u]||0)*.7);if(sum(comp)<2)return;
    const t=T(x,y),fort=t.b===1||t.b===3||t.w,dc=compOf(1,best),A=strength(comp,dc,true,x,y,'frontal')*1.2,D=strength(dc,comp,false,x,y,'')+fortV(x,y),chanceNow=Math.max(0,Math.min(1,(A/D-.75)/.5));
    const threshold=style==='conqueror'?.4:style==='opportunist'?.43:style==='warden'?.68:style==='merchant'?.7:.58;if(chanceNow<threshold*(d.ai>=2?.85:1))return;
    const tac=fort&&comp.sie?'siege':chanceNow>.8?'frontal':'cautious';if(S.sieges.some(g=>g.idx===best))return;
    for(const u in UN)a[u]-=comp[u];if(tac==='siege')startSiege(k,comp,best);else resolve(k,comp,best,tac);
  };
  const _clAiTick=aiTick;
  aiTick=function(){
    if(!S)return;initCLState();

  function clDiplomacyAction(k,type){
    if(!S||S.on)return toast('Diplomacy is currently available in offline games only.');
    initCLState();if(k<2||k>5||!S.tiles.some(t=>t.o===k))return toast('That rival no longer has a kingdom.');
    const cost=type==='trade'?150:type==='tribute'?60:100;if(S.coins<cost)return toast('You need 🪙'+cost+' for this agreement.');
    S.coins-=cost;S.clDiplomacy=S.clDiplomacy||{};S.clDiplomacy[k]={type,until:S.time+180};
    if(type==='tribute'){S.clDiplomacy[k].until=S.time+240;chron('🕊️',`Sent tribute to ${OWN[k].n}; its attacks are discouraged for 4 minutes.`)}
    else if(type==='trade')chron('🤝',`Trade pact signed with ${OWN[k].n}; supplies arrive periodically for 3 minutes.`);

  }
  window.clDiplomacyAction=clDiplomacyAction;
  const _clTick=tick;let clTradeTimer=0;
  tick=function(){_clTick();if(!S||S.on)return;initCLState();clTradeTimer+=.1;let changed=false;if(clTradeTimer>=30){clTradeTimer=0;for(const [k,p] of Object.entries(S.clDiplomacy||{})){if(p.until<=S.time){delete S.clDiplomacy[k];changed=true;continue}if(p.type==='trade'){gainR('wood',4);gainR('stone',3);changed=true;}}}if(changed)save();};

  /* Campaigns are layered over the existing Chronicle and use existing game counters. */
  const CAMPAIGNS=[
    {id:'frontier',name:'The Frontier',desc:'Expand carefully and establish a productive border.',steps:[{label:'Control 12 tiles',goal:12,progress:()=>owned(1)},{label:'Build 2 mines',goal:2,progress:()=>S.tiles.filter(t=>t.o===1&&t.b===2).length},{label:'Build a stronghold',goal:1,progress:()=>S.tiles.filter(t=>t.o===1&&t.b===3).length}],reward:{coins:180,wood:35,stone:35}},
    {id:'fortress',name:'The Broken Fortress',desc:'Prove that your army can win a costly conflict.',steps:[{label:'Win 2 battles',goal:2,progress:()=>S.st.won||0},{label:'Own 1 stronghold',goal:1,progress:()=>S.tiles.filter(t=>t.o===1&&t.b===3).length}],reward:{coins:260,stone:45}},
    {id:'merchant',name:'The Merchant Crown',desc:'Build a reliable economy and master the market.',steps:[{label:'Complete 3 trades',goal:3,progress:()=>S.st.trades||0},{label:'Own 1 market',goal:1,progress:()=>S.tiles.filter(t=>t.o===1&&t.b===5).length},{label:'Keep at least 500 coins',goal:500,progress:()=>Math.floor(S.coins||0)}],reward:{coins:300,wood:25,stone:25}},
    {id:'scholar',name:'The Royal Academy',desc:'Invest in knowledge and develop your kingdom.',steps:[{label:'Build an academy',goal:1,progress:()=>S.tiles.filter(t=>t.o===1&&t.b===7).length},{label:'Accumulate 30 research points',goal:30,progress:()=>Math.floor(S.rp||0)}],reward:{coins:150,silver:3}}
  ];
  function campaignDone(c){return c.steps.every(st=>st.progress()>=st.goal)}
  function campaignHtml(){

      h+=`<div class="mu" style="margin-top:5px">Reward: ${Object.entries(c.reward).map(([k,v])=>`${ICON[k]||k} ${v}`).join(' · ')}</div>`;
      if(done&&!claimed)h+=`<button style="width:100%;margin-top:6px" onclick="clClaimCampaign('${c.id}')">Claim campaign reward</button>`;
      h+='</div>';
    }return h;
  }
  window.clClaimCampaign=function(id){const c=CAMPAIGNS.find(q=>q.id===id);if(!c)return;if(S.on)return toast('Campaign reward claiming is offline-only in this update.');initCLState();if(S.clCampaigns[id]?.claimed||!campaignDone(c))return toast('Campaign is not ready to claim');S.clCampaigns[id]={claimed:true,time:S.time};if(c.reward.coins)S.coins+=c.reward.coins;for(const r of RES)if(c.reward[r])gainR(r,c.reward[r]);chron('📖',`Campaign completed: ${c.name}`);save();hud();renderSheet();toast('Campaign reward claimed!')};
  const _clVChron=vChron;
  vChron=function(){const current=S.evp&&EID[S.evp.id],scaled=getPromptEvent();if(current&&scaled)EID[S.evp.id]=scaled;const r=_clVChron();if(current)EID[S.evp.id]=current;if(S.evp&&S.evp.scale)r[1]=r[1].replace('Decide within',`Kingdom impact ×${S.evp.scale.toFixed(2)} · Decide within`);
    const cats=[['all','All'],['Military','Military'],['Economy','Economy'],['Expansion','Expansion'],['Research','Research'],['Events','Events']];
    let h='<div class="mi"><div class="mh"><span>🗂️</span><b>Chronicle filters</b></div><div style="display:flex;flex-wrap:wrap;gap:5px;margin:6px 0">'+cats.map(([id,label])=>`<button style="min-height:32px;padding:4px 8px" onclick="clSetHistoryFilter('${id}')">${S.clHistoryFilter===id?'✓ ':''}${label}</button>`).join('')+'</div>';
    const records=(S.chron||[]).filter(c=>S.clHistoryFilter==='all'||(S.clHistoryFilter==='Military'?/battle|siege|attack|army|rival|fortress|war/i.test(c.txt):S.clHistoryFilter==='Economy'?/coin|trade|market|income|resource|mine|caravan|price/i.test(c.txt):S.clHistoryFilter==='Expansion'?/claim|tile|city|land|seized|settlement|territory/i.test(c.txt):S.clHistoryFilter==='Research'?/research|academy|technology|tech/i.test(c.txt):/event|drought|winter|festival|caravan|unrest|rain|raid|chronicle|campaign/i.test(c.txt)));
    h+=records.length?records.slice(0,12).map(c=>`<div class="mf"><span>${c.ic} ${c.txt}</span><span>${mmss(c.t)}</span></div>`).join(''):'<div class="mu">No matching entries yet.</div>';
    h+='</div><div class="mi"><div class="mh"><span>🤝</span><b>Diplomacy</b><em>Offline</em></div><div class="mu">Non-aggression discourages attacks; trade pacts deliver small supply shipments; tribute temporarily reduces hostility. Agreements cost coins and expire.</div>';
    for(let k=2;k<6;k++)if(S.tiles.some(t=>t.o===k)){const p=S.clDiplomacy&&S.clDiplomacy[k],active=p&&p.until>S.time;h+=`<div class="mf"><span>${OWN[k].n}</span><span>${active?`${p.type} · ${mmss(p.until-S.time)}`:'No agreement'}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px 0"><button onclick="clDiplomacyAction(${k},'nonaggression')" style="min-height:38px">🕊️ Pact · 100🪙</button><button onclick="clDiplomacyAction(${k},'trade')" style="min-height:38px">🤝 Trade · 150🪙</button><button onclick="clDiplomacyAction(${k},'tribute')" style="min-height:38px">🎁 Tribute · 60🪙</button></div>`}
    h+='</div><div class="cl-campaigns">'+campaignHtml()+'</div>';r[1]+=h;return r};
  window.clSetHistoryFilter=function(id){S.clHistoryFilter=id;shK='';renderSheet()};

  /* Guided first-session tutorial, with skip/replay and no duplicate mission counters. */
  function showTutorial(){tutStep=Math.max(0,Math.min(tutSteps.length-1,tutStep));const q=tutSteps[tutStep];tut.innerHTML=`<b style="color:#ffcf4a">${q.title}</b><div style="margin-top:5px">${q.body}</div><div class="cl-tut-actions"><button id="cl-tut-prev" ${tutStep===0?'disabled':''}>← Back</button><button id="cl-tut-action">${q.action}</button><button id="cl-tut-next">${tutStep===tutSteps.length-1?'Finish':'Next →'}</button></div><div style="margin-top:6px;text-align:right"><button id="cl-tut-close">Skip tutorial</button></div>`;tut.style.display='block';$('cl-tut-prev').onclick=()=>{tutStep=Math.max(0,tutStep-1);showTutorial()};$('cl-tut-next').onclick=()=>{if(tutStep>=tutSteps.length-1){tut.style.display='none';META.tut.clGuided=1;saveMeta();toast('Tutorial completed')}else{tutStep++;showTutorial()}};$('cl-tut-action').onclick=()=>{q.run();showTutorial()};$('cl-tut-close').onclick=()=>{tut.style.display='none';META.tut.clGuided=1;saveMeta()}}

  /* Preserve v2 save structure/key; default new fields on load and before saving. */

    let raw=null;try{raw=localStorage.getItem(KEY);if(raw){const q=JSON.parse(raw);const valid=q&&q.v===2&&q.n===N&&Array.isArray(q.tiles)&&q.tiles.length===N*N&&q.tiles.every(t=>Array.isArray(t)?t.length>=4&&(Number.isFinite(+t[0])||typeof t[0]==='string'):t&&typeof t==='object');if(!valid){try{localStorage.setItem(KEY+'-recovery',raw);localStorage.setItem(KEY+'-recovery-time',new Date().toISOString())}catch(_){}}}}catch(_){if(raw){try{localStorage.setItem(KEY+'-recovery',raw)}catch(__){}}}
    const okLoad=_clLoad();if(okLoad)initCLState();return okLoad;
  };

     one-tap hint launcher without resetting missions or the player's realm. */
  const helpBtn=document.createElement('button');helpBtn.textContent='🧭';helpBtn.title='Guided tutorial';helpBtn.setAttribute('aria-label','Start guided tutorial');helpBtn.style.cssText='position:absolute;left:10px;top:10px;z-index:4;padding:6px 9px;background:#102b42eF';helpBtn.onclick=()=>{if(tut.style.display==='block')tut.style.display='none';else clStartTutorial()};wrap.appendChild(helpBtn);
  if(!had&&!META.tut.clGuided)setTimeout(()=>{if($('dm').style.display!=='flex'&&tut.style.display!=='block')clStartTutorial()},3500);

  setInterval(()=>{if(overlayTag.textContent!=='Overlay: '+overlayNames[overlayMode])overlayTag.textContent='Overlay: '+overlayNames[overlayMode]},500);
})();

<script>
/* ===== development tree screen ===== */
const DEVSZ=1900,DEVC=DEVSZ/2;

PATHS.forEach((P,pi)=>{const th=-Math.PI/2+pi*Math.PI/4,ux=Math.cos(th),uy=Math.sin(th);P.bx=DEVC+ux*112;P.by=DEVC+uy*112;P.lx=DEVC+ux*858;P.ly=DEVC+uy*858;P.ux=ux;P.uy=uy});
TECH.forEach(t=>{const P=PATHS[t.p],r=205+(t.tier-1)*118,off=t.lane==0?0:(t.lane==1?1:-1)*(48+7*(t.tier-2));t.x=DEVC+P.ux*r-P.uy*off;t.y=DEVC+P.uy*r+P.ux*off});

  art.innerHTML=`<svg class="ach-wires" style="width:${DEVSZ}px;height:${DEVSZ}px" viewBox="0 0 ${DEVSZ} ${DEVSZ}">${w.join('')}</svg>${b.join('')}<button type="button" class="ach-center" style="left:${DEVC}px;top:${DEVC}px" onclick="devOverview()" aria-label="Overview">🏰</button>`;
