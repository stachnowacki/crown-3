name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # No npm cache here: this repository currently has no package-lock.json.

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check web app files
        run: |
          if [ ! -f www/index.html ]; then
            echo "::error::Could not find www/index.html. The Crownlands web app must be in the www folder."
            exit 1
          fi

      - name: Create Capacitor config if missing
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ] && [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.crownlands.game",
            "appName": "Crownlands",
            "webDir": "www"
          }
          EOF
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure portrait and fullscreen display
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android:screenOrientation=' "$MANIFEST"; then
            sed -i 's/<activity /<activity android:screenOrientation="portrait" android:hardwareAccelerated="true" /' "$MANIFEST"
          fi

          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ] && ! grep -q 'android:windowFullscreen' "$STYLES"; then
            sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#' "$STYLES"
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crownlands-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
