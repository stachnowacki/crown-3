  else if(a=='mine'){c=mineCost(t.t);if(!canPay(c))return;pay(c);t.b=2;t.l=1;S.st.built++;toast('Mine opened')}

  else if(a=='up'){const l=lv(t);c=UPC[t.b](t,l);if(l>=MAXL[t.b]||!canPay(c))return;pay(c);t.l=l+1;S.st.upgrades++;toast('Upgraded to level '+t.l)}

    if(Math.random()<chance(x,y)){const loot=Math.round((25+(t.b==1?60*t.l:0))*(1+rt('loot')));S.coins+=loot;t.o=1;S.st.gained++;S.st.won++;toast('Victory! Looted 🪙'+compactAmount(loot));kingdomCheck()}else{S.st.lostB++;toast('Attack repelled')}}

/* ===== Kingdom Overview: one screen that answers "how is my realm doing?" =====

  function ovEconomy(){
    const inc=S.inc||0, upk=typeof UPK==='number'?UPK:0;

    if(upk)rows.push(['⚔️ Army & building upkeep',-upk]);

    return{rows,total,inc};
  }
  function ovMines(){
    const out={};for(const r of RES)out[r]=0;
    const full=[];
    const cp=cap();for(let i=0;i<S.tiles.length;i++){const t=S.tiles[i];if(t.o!=1||t.b!=2||t.off>S.time)continue;const r=MR[t.t];if(!r)continue;
      out[r]+=mineOut(t,r,i); if(S.res[r]>=cp*.999)full.push(r)}
    return{out,full:[...new Set(full)]};
  }
  function ovArmy(){
    const tl=tally(),ready=sum(S.army),gar=ready?0:0;

  }
  function ovThreats(){

    if(S.st&&S.st.hold!=null&&S.st.hold<20)list.push(['⚠️','Your borders were recently breached — rebuild walls and garrisons.']);
    let edgeN=0,mineN=0;for(let i=0;i<S.tiles.length;i++){const t=S.tiles[i];if(t.o!=1)continue;mineN++;if(edge(i%N,(i/N)|0))edgeN++}

<div class="ovbox">

 for(const c of cats){q[c]=Math.max(1,Math.round(10*w[c]/sum));tot+=q[c]}
 while(tot>10){const c=cats.filter(z=>q[z]>1).sort((a,b)=>q[b]-q[a])[0];if(!c)break;q[c]--;tot--}while(tot<10){const c=cats.sort((a,b)=>w[b]/q[b]-w[a]/q[a])[0];q[c]++;tot++}
 const out=[],used=new Set();

.q-day.got{background:#123d2a;border-color:#3ddc97;opacity:.8}.q-day.now{border-color:#ffcf4a;background:#3d3416;animation:qGlow 1.5s ease-in-out infinite}
.q-fire{font-size:15px;font-weight:800;color:#ffb35a}
.q-wonder{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start}
.q-wonder svg{width:76px;height:auto;border-radius:8px;background:linear-gradient(#27456b,#0f2036)}
.q-cost{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:12px}
.q-cost span{border:1px solid #2c4a6e;border-radius:8px;padding:1px 6px;background:#0b1626}.q-cost span.ok{border-color:#3ddc97;color:#a8f0cd}
.q-run{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid #1d3550}.q-run:last-child{border-bottom:0}

.x7c.q-claim{box-shadow:0 0 12px #ffcf4a55}
/* dock + menu markers: a number badge and a glow on the way to every reward */
.bdg.dot[data-n]::after{content:attr(data-n);width:auto;min-width:20px;height:20px;box-sizing:border-box;padding:0 5px;top:-5px;right:-5px;border-radius:10px;font:800 11.5px/16px sans-serif;color:#fff;text-align:center;border:2px solid #0b1a2a;background:#ff3b4a;z-index:3}
#dock button.q-glow{animation:qGlow 1.4s ease-in-out infinite;overflow:visible}

@media (prefers-reduced-motion:reduce){.q-hot,#dock button.q-glow,.q-day.now{animation:none}}
</style>
<script>
/* ===== Crownlands missions redesign (loaded last) =====
   - One mission screen, five tiers from small to big: Daily (gift streak + 3 tasks), Tasks (simple, instant resources),
     Quests (side challenges, chest), Goals (objectives + milestones, rare chest), Wonders (Great Works + Monuments together).
   - Ready rewards are always on top; a number badge and a glow lead from the dock, through the tab, to the claim button.
   - Events replace Home in the dock (Home moves to the map controls).
   - Open screens refresh by patching their DOM instead of rebuilding it, so scrolling stays smooth. */
(function(){
'use strict';
const $q=id=>document.getElementById(id),fm=n=>compactAmount(Math.round(n||0)),GX=()=>window.__gx||null;
const incQ=()=>Math.max(1,(S&&(S.incE||S.inc))||1),secs=n=>Math.max(20,Math.round(incQ()*n*rwK())),frac=f=>Math.max(3,Math.round(cap()*f*rwK()));
const GI='<i class="gm"></i>';

/* ---------- 1. scroll-safe refresh ---------- */
function sync(a,b){const an=a.childNodes,bn=b.childNodes;
 for(let i=0;i<bn.length;i++){const x=an[i],y=bn[i];
  if(!x){a.appendChild(y.cloneNode(true));continue}
  if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);continue}
  if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
  const foc=x===document.activeElement,det=x.nodeName==='DETAILS';
  for(let k=x.attributes.length-1;k>=0;k--){const n=x.attributes[k].name;if(det&&n==='open')continue;if(!y.hasAttribute(n))x.removeAttribute(n)}
  for(let k=0;k<y.attributes.length;k++){const n=y.attributes[k].name,v=y.attributes[k].value;if(det&&n==='open')continue;if(foc&&n==='value')continue;if(x.getAttribute(n)!==v)x.setAttribute(n,v)}
  if((x.nodeName==='INPUT'||x.nodeName==='SELECT')&&!foc&&x.value!==y.value)x.value=y.value;
  sync(x,y)}
 while(an.length>bn.length)a.removeChild(a.lastChild)}
function morph(el,html){const t=document.createElement('div');t.innerHTML=html;sync(el,t)}
window.qMorph=morph;
renderSheet=function(){if(!SH)return;let fn=null;try{fn={menu:vMenu,army:vArmy,dev:vDev,chron:vChron,ach:vAch,set:vSet,help:vHelp,cat:vCat,battle:vBattle,sea:vSea,rank:vRank,war:vWar,report:vReport}[SH]}catch(e){}
 fn=fn||(window.XSH&&XSH[SH]);if(!fn)return closeSheet();const v=fn();
 const h=`<div class="mh" style="padding:10px"><b style="font-size:18px">${v[0]}</b><button onclick="closeSheet()" style="margin-left:auto;text-align:center" aria-label="Close">✕</button></div><div id="shl">${v[1]}</div>`;
 if(h===shK)return;const el=$q('sh'),same=lastSH===SH&&!!$q('shl');shK=h;el.classList.toggle('noanim',same);
 if(same)morph(el,h);else{el.innerHTML=h;const n=$q('shl');if(n)n.scrollTop=0}lastSH=SH};
/* switching an Event Centre tab starts at the top */
try{const _tb=X7.tab;X7.tab=function(t){lastSH=null;_tb(t)};const _oe=X7.openEC;X7.openEC=function(t){lastSH=null;_oe(t);qBadges(true)}}catch(e){}
/* the old Great Works sheet now lives in Missions > Wonders */
const _os=openSheet;openSheet=function(n){if(n==='gw')return openMis('won');return _os(n)};

/* ---------- 2. Tasks: the simple missions, one line of steps per category ---------- */
for(let i=MIS.length-1;i>=0;i--)if(MIS[i].cat==='Long-term')MIS.splice(i,1);   /* covered by Goals > Milestones */
const TCAT=['Tutorial','Expansion','Development','Economy','Trade','Military','Defense'];
function taskData(){const ready=[],act=[],seen={},done=[];
 for(const m of MIS){const st=mstat(m);if(st==='claimed'){done.push(m);continue}if(st==='locked')continue;
  if(m.req&&!(S.ms[m.req]&&S.ms[m.req].c))continue;          /* the step before must be claimed first */
  if(st==='ready')ready.push(m);else if(!seen[m.cat]){seen[m.cat]=1;act.push(m)}}
 act.sort((a,b)=>TCAT.indexOf(a.cat)-TCAT.indexOf(b.cat));return{ready,act,done}}
const stepOf=m=>{const l=MIS.filter(q=>q.cat===m.cat);return`${l.filter(q=>(S.ms[q.id]||{}).c).length+1}/${l.length}`};
window.qTask=function(id){const m=MID[id],r=S.ms[id];if(!m||!r||r.c||mstat(m)!=='ready')return;const txt=rwStr(m.rw);
 r.c=1;S.st.missions=(S.st.missions||0)+1;give(m.rw);try{X7.pts(2,'ms')}catch(e){}
 try{sfx('mission')}catch(e){}buzz();save();toast('🎁 '+m.name+': '+txt);snap();hud();qRender(false);qBadges(true)};

/* ---------- 3. Quests: side challenges, three at a time, each with a chest ---------- */
const rivalsAlive=()=>{for(let k=2;k<6;k++)if(S.tiles.some(t=>t.o===k))return true;return false};
sideFill=function(){if(!S.side)S.side=[];let guard=0;
 while(S.side.length<3&&S.time>=(S.sideAt||0)&&guard++<6){const used=S.side.map(q=>q.k),alive=S.on||rivalsAlive();
  const pool=STPL.filter(t=>!used.includes(t[0])&&t[0]!==S.sideNo&&!((t[0]==='won'||t[0]==='repelled')&&!alive)&&!(S.on&&t[0]==='repelled'));if(!pool.length)break;
  const t=pool[rnd(0,pool.length)|0],gi=rnd(0,t[2].length)|0,tier=(window.kdevTier?kdevTier():0),mult=[1,1.4,1.9,2.6,3.4,4.4][tier]*(t[0]==='won'||t[0]==='repelled'?.7:1);
  const g=Math.max(t[2][gi],Math.round(t[2][gi]*mult));
  S.side.push({k:t[0],g,b:S.st[t[0]]||0,n:t[1].replace('{g}',g),rw:[Math.round(t[3]*t[2][gi]*(1+gi*.3)),8+t[2][gi]*3+tier*6,{}]});S.sideN=(S.sideN||0)+1}};
const qProg=q=>Math.max(0,(S.st[q.k]||0)-q.b);
window.qQuest=function(i){const q=S.side[+i];if(!q||qProg(q)<q.g)return;misClaim(+i,1);S.sideAt=S.time+60;qRender(false);qBadges(true)};
window.qSwap=function(i){const q=S.side[+i];if(!q)return;const w=(S.sideSw||-1e9)+300-S.time;if(w>0)return toast('You can swap a quest again in '+mmss(w));
 S.side.splice(+i,1);S.sideNo=q.k;S.sideAt=S.time;sideFill();S.sideNo=null;S.sideSw=S.time;toast('🎲 New quest');qRender(false)};

/* ---------- 4. Goals: strategic objectives + endless milestones, each with a rare chest ---------- */
const V6=()=>window.V6G;
function goalData(){const g=V6(),rd=[],act=[],done=[];if(!g)return{rd,act,done};
 for(const o of g.SOB){const got=!!(S.sob&&S.sob[o.id]),v=o.v(),gg=o.g(),it={t:'sob',o,v,g:gg};if(got)done.push(it);else if(v>=gg)rd.push(it);else act.push(it)}
 for(const m of g.MST){const l=g.mstLv(m.k),fin=g.mstDone(m),v=m.v(),gg=fin?v:m.g(l),it={t:'mst',m,l,v,g:gg};if(fin)done.push(it);else if(g.mstReady(m))rd.push(it);else act.push(it)}
 act.sort((a,b)=>b.v/Math.max(1,b.g)-a.v/Math.max(1,a.g));return{rd,act,done}}
const mstChest=l=>l<3?0:l<8?1:2;   /* rebalance: from level 12 a milestone has a 4% chance to upgrade to a Golden Chest */
function chestGive(t){const g=GX();if(!g||(S&&S.on))return;g.chestAdd(t,1);if(!window.chestGot)setTimeout(()=>toast('📦 '+g.TR[t].n+' added — open it in the Treasury (Menu)'),900)}
const chestName=t=>{const g=GX();return g?g.TR[t].n:'Chest'};
{const _ms=window.mstClaim;window.mstClaim=function(k){const g=V6(),l0=g.mstLv(k);_ms(k);if(g.mstLv(k)>l0){chestGive(l0>=12&&Math.random()<.04?3:mstChest(l0));try{X7.pts(4,'ms')}catch(e){}}qRender(false);qBadges(true)};
 const _so=window.sobClaim;window.sobClaim=function(id){const had=!!(S.sob&&S.sob[id]);_so(id);if(!had&&S.sob&&S.sob[id]){chestGive(Math.random()<.1?3:2);try{X7.pts(6,'ms')}catch(e){}}qRender(false);qBadges(true)}}

/* ---------- 5. Wonders: Great Works and Monuments as one list of long projects ---------- */
const GWART={granary:['hal','#e8c070'],exchange:['arc','#ffd34a'],deepmines:['obe','#c08a5a'],citadel:['zig','#9aa4b4'],library:['col','#8d79ff'],warcollege:['pyr','#ff6b5a'],crown:['gar','#ffd34a']};
const FXN={store:'storage',inc:'income',prod:'mine output',dfn:'fortification',rps:'research',atk:'attack'};
function wonderData(){const g=V6();let mo=null;try{mo=X7.mons()}catch(e){}const out=[];
 if(g)for(const w of g.GW){const st=g.gwSt(w.id),mx=g.gwMax(w),ok=(()=>{try{return w.req()}catch(e){return false}})();
  const a=GWART[w.id]||['pyr','#ffd34a'];out.push({kind:'gw',id:w.id,ic:w.ic,n:w.n,d:w.d,st,mx,ok,rq:w.rq,need:st<mx?g.gwCost(w,st):null,paid:((S.gw||{})[w.id]||{}).paid||{},
   now:st?Object.keys(w.fx).map(k=>k==='ucap'?'+'+w.fx[k]*st+' army limit':k==='spr'?'−'+(w.fx[k]*st*100).toFixed(1)+'% spread':'+'+Math.round(w.fx[k]*st*100)+'% '+(FXN[k]||k)).join(', '):'',
   art:()=>mo?mo.monArt({col:a[1],sh:a[0],n:w.n},Math.min(4,Math.round(4*st/mx))):''})}
 if(mo)for(const m of mo.MON){const st=mo.monSt(m.id),ok=(()=>{try{return m.req()}catch(e){return false}})();
  out.push({kind:'mon',id:m.id,ic:m.ic,n:m.n,d:m.fxt,st,mx:4,ok,rq:m.rq,need:st<4?mo.monCost(m,st):null,paid:((mo.mon[m.id]||{}).paid)||{},stage:mo.MSTN[Math.min(st,3)],
   now:st?(st>=4?'Ascended':st>=3?'Standing in your capital':'Under construction'):'',art:()=>mo.monArt(m,st)})}
 for(const w of out){w.done=w.st>=w.mx;const ks=w.need?Object.keys(w.need):[];
  w.pc=ks.length?ks.reduce((a,k)=>a+Math.min(1,(w.paid[k]||0)/w.need[k]),0)/ks.length:1;
  w.can=!w.done&&w.ok&&ks.every(k=>(k==='coins'?S.coins:(S.res[k]||0))>=w.need[k]-(w.paid[k]||0));
  w.some=!w.done&&w.ok&&ks.some(k=>(w.paid[k]||0)<w.need[k]&&(k==='coins'?S.coins:(S.res[k]||0))>=1)}
 return out}
window.qWonder=function(kind,id){if(kind==='gw')gwContribute(id);else X7.mon(id);qRender(false);qBadges(true)};

/* ---------- 6. Daily: a gift streak, three quick tasks and a bonus chest ---------- */
const dstr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>dstr(new Date()),yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const toMidnight=()=>{const d=new Date(),m=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return m-d};
const hms=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m ${s%60}s`};
const DCTR={gained:()=>S.st.gained||0,built:()=>S.st.built||0,upgrades:()=>S.st.upgrades||0,trades:()=>S.st.trades||0,trained:()=>S.st.trained||0,won:()=>S.st.won||0,
 techs:()=>Object.keys(S.tech||{}).length,earn:()=>(S.x7&&S.x7.c&&S.x7.c.earn)||0,missions:()=>S.st.missions||0};
const DQP=[
 {k:'gained',ic:'🗺️',n:'Claim {g} new tiles',g:[3,4,6,8,10,12],go:'claim'},
 {k:'built',ic:'🏗️',n:'Construct {g} buildings',g:[2,3,4,5,6,8],go:'city'},
 {k:'upgrades',ic:'⬆️',n:'Upgrade buildings {g} times',g:[3,4,6,8,10,12],go:'cityUp'},
 {k:'trades',ic:'⚖️',n:'Make {g} trades at the Market',g:[3,4,5,6,8,10],go:'market'},
 {k:'trained',ic:'🗡️',n:'Recruit {g} units',g:[5,10,15,25,40,60],go:'army'},
 {k:'won',ic:'⚔️',n:'Win {g} battles',g:[1,2,2,3,4,5],go:'enemy',ok:()=>S.on||rivalsAlive()},
 {k:'techs',ic:'🎓',n:'Complete {g} research',g:[1,1,1,2,2,2],go:'dev',ok:()=>Object.keys(S.tech||{}).length<TECH.length-1},
 {k:'earn',ic:'🪙',n:'Earn {g} coins',earn:1,go:''},
 {k:'missions',ic:'🎯',n:'Claim {g} mission rewards',g:[2,2,3,3,3,4],go:'task'}];
const DQID={};DQP.forEach(q=>DQID[q.k]=q);
function dq(){const d=S.dq&&typeof S.dq==='object'?S.dq:(S.dq={day:'',t:[],bon:0,gift:'',streak:0,best:0});const td=today();
 if(d.day!==td){d.day=td;d.bon=0;const tier=window.kdevTier?kdevTier():0,h=s=>CORE7.h32(s);
  const pool=DQP.filter(q=>{try{return!q.ok||q.ok()}catch(e){return false}}).sort((a,b)=>h(td+a.k)-h(td+b.k)).slice(0,3);
  d.t=pool.map(q=>({k:q.k,g:q.earn?Math.max(400,Math.round(incQ()*600)):q.g[Math.min(tier,q.g.length-1)],b:DCTR[q.k](),c:0}))}
 if(!Array.isArray(d.t))d.t=[];return d}
const dqProg=t=>Math.max(0,DCTR[t.k]()-t.b);
const dqTaskRw=()=>({c:secs(150),res:{wood:frac(.05),stone:frac(.05)}});
const streakNext=d=>d.gift===today()?d.streak:(d.gift===yesterday()?d.streak+1:1);
const dqBonusRw=d=>{const s=streakNext(d),o={c:secs(300),res:{silver:frac(.03)}};if(s>=14)o.ch=1;else if(s>=3)o.ch=0;return o};
/* update 18.11: bigger daily gifts - a chest on most days, gems from day 3, and the weekly multiplier keeps growing */
const GIFT=[{c:240,ic:'🪙'},{c:360,r:.08,gm:1,ic:'🪵'},{c:420,ch:0,gm:1,ic:'📦'},{c:600,r:.1,m:1,gm:2,ic:'🥈'},{c:720,ch:0,gm:2,ic:'📦'},{c:900,r:.14,m:1,gm:3,ic:'🥇'},{c:1500,r:.18,m:1,ch:1,gm:6,ic:'👑'}];
function giftRw(day){const i=(day-1)%7,wk=Math.floor((day-1)/7),k=1+.35*Math.min(wk,6),G=GIFT[i],o={c:Math.round(secs(G.c)*k),res:{},gm:G.gm?G.gm+Math.min(wk,6):0};if(G.ch!=null)o.ch=G.ch;
 if(G.r){o.res.wood=Math.round(frac(G.r)*k);o.res.stone=Math.round(frac(G.r)*k)}if(G.m){o.res.silver=Math.round(frac(G.r*.4)*k);if(i>=5)o.res.gold=Math.round(frac(G.r*.2)*k)}
 if(i===6&&wk>=1)o.ch=2;if(i===6&&wk>=3)o.ch=3;if(i===4&&wk>=2)o.ch=1;return o}
/* the daily pop-up (end of the file) reads the streak through this */
window.qDailyInfo=()=>{const d=dq();return{d,today:today(),yest:yesterday(),next:streakNext(d),got:d.gift===today(),rw:giftRw,txt:rwTxt,chips:rwChips,ic:i=>GIFT[(i-1)%7].ic,left:hms(toMidnight())}};
const rwTxt=o=>[o.c?`🪙${fm(o.c)}`:'',...Object.keys(o.res||{}).filter(k=>o.res[k]>0).map(k=>`${ICON[k]}${fm(o.res[k])}`),o.ch!=null&&!S.on?`📦 ${chestName(o.ch)}`:'',o.gm&&!S.on?`${GI}${o.gm}`:''].filter(Boolean);
const rwChips=o=>`<div class="q-rw">${rwTxt(o).map(t=>`<span class="${t.startsWith('📦')?'ch':''}">${t}</span>`).join('')}</div>`;
function grantQ(o){S.coins+=o.c||0;for(const k of RES)if(o.res&&o.res[k])S.res[k]=(S.res[k]||0)+o.res[k];
 if(o.ch!=null)chestGive(o.ch);if(o.gm){const g=GX();if(g)g.addGems(o.gm,true)}}
window.qGift=function(){const d=dq(),td=today();if(d.gift===td)return;d.streak=streakNext(d);d.gift=td;d.best=Math.max(d.best||0,d.streak);const o=giftRw(d.streak);grantQ(o);
 try{sfx('win')}catch(e){}buzz();try{chron('🎁','Daily gift — day '+d.streak+' of the streak')}catch(e){}save();hud();toast(`🔥 Day ${d.streak} gift: `+rwTxt(o).join(' ').replace(/<[^>]+>/g,'💠'));qRender(false);qBadges(true)};
window.qDaily=function(i){const d=dq(),t=d.t[+i];if(!t||t.c||dqProg(t)<t.g)return;t.c=1;const o=dqTaskRw();grantQ(o);S.st.missions=(S.st.missions||0)+1;try{X7.pts(2,'ms')}catch(e){}
 try{sfx('mission')}catch(e){}buzz();save();hud();toast('✅ Daily task: '+rwTxt(o).join(' '));qRender(false);qBadges(true)};
window.qBonus=function(){const d=dq();if(d.bon||!d.t.length||!d.t.every(t=>t.c))return;d.bon=1;const o=dqBonusRw(d);grantQ(o);try{sfx('win')}catch(e){}buzz();save();hud();toast('🏆 Daily bonus: '+rwTxt(o).join(' ').replace(/<[^>]+>/g,''));qRender(false);qBadges(true)};
const rankReady=()=>{try{return typeof chestReady==='function'&&chestReady()}catch(e){return false}};
window.qRank=function(){try{claimChest()}catch(e){}qRender(false);qBadges(true)};

/* ---------- 7. go to the place on the map (or the screen) where a goal is done ---------- */
window.qGo=function(k){if(!k)return;if(k==='task')return setTab('task');if(k==='market'){closeMis();return openM()}if(k==='army'){closeMis();return openSheet('army')}if(k==='dev'){closeMis();return openDev()}
 const p=hlTile(k);if(!p)return toast('Nothing to point at yet for this goal');closeMis();S.sel=p;center(p[0],p[1]);HL={x:p[0],y:p[1],t:performance.now()+7000};last='';render()};

/* ---------- 8. counts: what can be claimed (or completed) right now ---------- */
let CNT={daily:0,task:0,quest:0,goal:0,won:0,ev:0,menu:0,chests:0,tot:0},CNT_AT=0;
function counts(force){const n=performance.now();if(!force&&n-CNT_AT<800)return CNT;CNT_AT=n;if(!S||!S.tiles)return CNT;
 const c={daily:0,task:0,quest:0,goal:0,won:0,ev:0,menu:0,chests:0};
 try{const d=dq();c.daily=(d.gift!==today()?1:0)+d.t.filter(t=>!t.c&&dqProg(t)>=t.g).length+(!d.bon&&d.t.length&&d.t.every(t=>t.c)?1:0)+(rankReady()?1:0)}catch(e){}
 try{c.task=taskData().ready.length}catch(e){}
 try{c.quest=(S.side||[]).filter(q=>qProg(q)>=q.g).length}catch(e){}
 try{c.goal=goalData().rd.length}catch(e){}

<script>
/* ===== map performance: canvas memory budget =====
   The map caches pre-rendered terrain chunks (CHK) and building sprites (SPR) as canvases. Unbounded, a phone at full zoom
   could hold ~700 MB of them after panning the island, until the GPU dropped the canvas (frozen, then black map).
   - Both caches are LRU with a pixel budget sized from the device's memory; evicted canvases are released (width=0) right
     after the frame, so the browser frees their memory at once instead of waiting for garbage collection.
   - Chunk backing stores are capped at MAXSIDE pixels per side (a barely visible softening only at the highest zoom).

.dp-day{background:#0b1620;border:1px solid #2b4a68;border-radius:12px;padding:6px 2px;text-align:center;font-size:11px;color:#9fc3e0;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.dp-day b{font-size:20px}.dp-day small{font-size:9.5px;line-height:1.15;color:#cfe3f5;word-break:break-word}
.dp-day.got{opacity:.55}.dp-day.got b{color:#7bd88f}
.dp-day.now{border:2px solid #ffd23f;background:#2b2a12;color:#ffe9a0;box-shadow:0 0 18px #ffd23f66;animation:dpP 1.4s ease-in-out infinite}
@keyframes dpP{50%{transform:translateY(-3px)}}
.dp-next{display:flex;flex-direction:column;gap:4px;margin-top:8px}.dp-next div{display:flex;justify-content:space-between;gap:8px;background:#0b1620;border-radius:10px;padding:5px 9px;font-size:13px}
/* chest you just got */
#gxgot .u-card{text-align:center;width:min(380px,100%)}#gxgot img{width:150px;height:150px;animation:gBo 1.2s ease-in-out infinite}
@keyframes gBo{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.gx-fly{position:fixed;z-index:80;pointer-events:none;transition:transform .75s cubic-bezier(.5,-.3,.7,1),opacity .75s ease-in}
.u-pulse{animation:uPu .6s ease 2}@keyframes uPu{50%{transform:scale(1.25);filter:brightness(1.6)}}
/* opening many chests */
#gxbulk{flex-direction:column;gap:10px;justify-content:flex-start;overflow:auto;background:#020a14f5;z-index:70}#gxgot,#dpop{background:#020a14ee;z-index:65}#gxbulk.done .bk-stage,#gxbulk.done .bk-tal{display:none}
#gxbulk .bk-h{display:flex;align-items:center;gap:8px;width:min(620px,100%)}#gxbulk .bk-h b{font-size:18px;flex:1}
.bk-phase{font-size:24px;font-weight:900;letter-spacing:1px;color:var(--pc,#38ff8c);text-shadow:0 0 18px var(--pc,#38ff8c);text-align:center;min-height:32px}
.bk-phase.flash{animation:bkF .5s ease}@keyframes bkF{0%{transform:scale(1.6);opacity:.2}}
.bk-stage{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.bk-stage:before{content:'';position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,var(--pc,#38ff8c) 0%,transparent 68%);opacity:.55}
.bk-stage canvas{width:200px;height:200px;position:relative}.bk-stage canvas.pop{animation:bkP var(--d,.3s) ease-out}
@keyframes bkP{0%{transform:scale(.5) translateY(30px);opacity:.3}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.bk-n{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-weight:800;font-size:13px;color:#cfe3f5}
.bk-tal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;width:min(620px,100%)}
.bk-c{position:relative;background:#0b1620;border:1px solid #2b4a68;border-radius:12px;padding:7px 10px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.bk-c span{font-size:20px}.bk-c.hit{border-color:var(--pc,#38ff8c);box-shadow:0 0 12px var(--pc,#38ff8c)}
.bk-pl{position:absolute;right:8px;top:-10px;font-size:12px;color:var(--pc,#38ff8c);animation:bkU .7s ease-out forwards;pointer-events:none}
@keyframes bkU{to{transform:translateY(-16px);opacity:0}}
.bk-lv{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.bk-lv i{font-style:normal;border-radius:10px;padding:3px 10px;font-weight:800;font-size:13px;background:#0b1620;border:1px solid var(--c);color:var(--c)}
.bk-sum{width:min(620px,100%);display:flex;flex-direction:column;gap:8px;align-items:stretch}
/* chat */
.cx-rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;align-items:center}
.cx-rx button{min-height:24px;padding:0 7px;border-radius:12px;font-size:13px;background:#0b1620;border:1px solid #2b4a68;flex:none;line-height:22px;text-align:center}
.cx-rx button.me{border-color:#ffd23f;background:#2b2a12}.cx-rx .cx-add{opacity:.55}.cx-rx .cx-add:hover{opacity:1}
.chat-new{align-self:stretch;display:flex;align-items:center;gap:8px;color:#ff8a5a;font-size:12px;font-weight:800;margin:4px 0}
.chat-new:before,.chat-new:after{content:'';flex:1;height:1px;background:#ff8a5a88}
/* visiting islands */
#visit{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px;background:#04101cf7}
#visit .vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#visit .vh b{font-size:18px}
#visit .vw{position:relative;flex:1;min-height:200px;border:2px solid #3a638a;border-radius:16px;overflow:hidden;background:#04121f;touch-action:none}
#visit canvas{width:100%;height:100%;display:block}
#visit .vz{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}#visit .vz button{width:42px;min-height:42px;padding:0;text-align:center;font-size:20px}
#visit .vi{display:flex;gap:6px;overflow-x:auto;font-size:12px}#visit .vi span{flex:none;background:#0b1620;border:1px solid #2b4a68;border-radius:10px;padding:4px 8px}
#visit .vtip{position:absolute;left:8px;top:8px;background:#000b;border-radius:10px;padding:4px 9px;font-size:12px;pointer-events:none;max-width:70%}
.vis-b{min-height:26px!important;padding:0 8px!important;font-size:12px!important;margin-left:4px}
/* chest opening: the rewards sit below the chest and wrap downwards, smaller, so every prize stays visible */
#cho .rw{top:calc(42% + min(17vw,96px));bottom:calc(74px + env(safe-area-inset-bottom,0px));max-height:none;align-content:flex-start;padding:10px 12px 14px;gap:6px}
#cho .rcd{min-width:64px;padding:4px 7px;border-radius:11px}#cho .rcd span{font-size:21px}#cho .rcd b{font-size:11.5px}
#cho .rw.many .rcd{min-width:54px;padding:3px 5px}#cho .rw.many .rcd span{font-size:17px}#cho .rw.many .rcd b{font-size:10.5px}
